version: '3.8'
services:
  api:
    container_name: bytebank-api
    build:
      context: ../
      dockerfile: ./docker/api.Dockerfile
    ports:
      - "3333:3333"
    environment:
      - NODE_ENV=development
    restart: unless-stopped
  
  api-files:
    container_name: bytebank-api-files
    build:
      context: ../
      dockerfile: ./docker/api-files.Dockerfile
    ports:
      - "3334:3334"
    environment:
      - NODE_ENV=development
    restart: unless-stopped